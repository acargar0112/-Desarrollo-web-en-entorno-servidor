{% extends "base.html" %}

{% block url %}<link rel="stylesheet" href="{{ url_for('static', filename='css/index_electrodomesticos.css') }}">{% endblock %}

{% block titulo %}<h1>Inicio</h1>{% endblock %}

{% block contenido %}

<ul>
    {% for producto in productos %}
    <li>{{producto.nombre}}</li>
    <img src="{{url_for('static', filename='img/' + producto.img)}}" alt="{{producto.nombre}}" width="20%" height="50%">
    {% endfor %}
</ul>

{% endblock %}
